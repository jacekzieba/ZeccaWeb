name: CI

# Bramka dla web: typy, testy jednostkowe z progami pokrycia i e2e w przeglądarce.
# Wcześniej nic tego nie uruchamiało — 14 z 38 specyfikacji e2e było czerwonych po
# zmianach UI (własny Select, ConfirmDialog, nowy modal), a nikt się o tym nie dowiedział.
#
# Lint (`npm run lint`) celowo NIE jest bramką: ma kilkaset błędów sprzed tego workflow.
# Włącz go, gdy zejdzie do zera, żeby nowy błąd nie ginął w starym szumie.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tryb fake-sync nie łączy się z backendem, ale middleware wymaga, by adres i klucz
  # Supabase istniały. Wartości zastępcze — żadnych sekretów w CI.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

jobs:
  unit:
    name: Typy i testy jednostkowe (z progami pokrycia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testy jednostkowe + progi pokrycia
        run: npm run test:coverage

  csp:
    name: CSP na wersji produkcyjnej
    # W next dev CSP jest tylko Report-Only, więc e2e nie widzą wymuszonej
    # polityki. Usunięcie `dynamic = "force-dynamic"` albo nonce psułoby
    # hydratację na produkcji, a reszta CI by tego nie zauważyła.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Przeglądarka
        run: npx playwright install --with-deps chromium
      - name: Build produkcyjny
        run: npm run build
      - name: Sprawdzenie CSP
        run: |
          npx next start -p 3200 &
          npx --yes wait-on@8 http://127.0.0.1:3200/login --timeout 60000
          BASE=http://127.0.0.1:3200 node scripts/csp-check.mjs

  e2e:
    name: e2e (fake-sync, scenariusz certyfikacyjny i strony publiczne)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Przeglądarka
        run: npx playwright install --with-deps chromium
      - name: e2e fake-sync
        run: npm run test:e2e:fake-sync
      - name: e2e certyfikacyjne
        run: npx playwright test --config playwright.fake-sync-cert.config.ts
      # Landing, rejestracja, bramka logowania i tryb demo bez fake-sync. Supabase
      # tylko z wartości zastępczych wyżej — bez sekretów i bez dostępu do produkcji.
      - name: e2e strony publiczne
        run: npm run test:e2e
      - name: Ślady przy porażce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
